[package]
name = "sandsim"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Live sand table simulation for theta-rho patterns (.thr) in the browser"

[dependencies]
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.36"
log = "0.4"
web-time = "1.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger = "0.11"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlCanvasElement", "Element", "HtmlElement", "Blob", "BlobPropertyBag", "Url", "HtmlAnchorElement", "HtmlInputElement", "FileList", "File", "CssStyleDeclaration", "Worker", "MessageEvent", "DedicatedWorkerGlobalScope", "Navigator"] }
js-sys = "0.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.dev]
opt-level = 2
